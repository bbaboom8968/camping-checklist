:root[data-theme="dark"]{--bg:#171c19;--card:#202723;--tx:#e7ece8;--mu:#91a097;--ac:#6fc298;--ac2:#27352d;--bd:#33403a;--wn:#e59a68}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:16px;margin:0 0 8px}h3{font-size:13px;color:var(--mu);margin:12px 0 2px}
.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.sec{font-size:17px;font-weight:700;margin:18px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.num{display:flex;align-items:center;gap:10px}
.num button{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.num.sm button{width:30px;height:30px;font-size:16px}
.num b{min-width:24px;text-align:center}
.it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}
label.it{cursor:pointer;justify-content:flex-start;align-items:flex-start}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none;margin-top:2px}
.nt{color:var(--mu);font-size:13px}
.done .n{text-decoration:line-through;color:var(--mu)}
.big{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--mu);padding:8px 12px;border-radius:10px;font:inherit;font-size:13px;cursor:pointer}
.bar{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .2s}
.buy{color:var(--wn)}.tools{display:flex;gap:8px;margin-bottom:10px}
.add{display:grid;grid-template-columns:1fr 90px 70px;gap:6px;margin-bottom:8px}
input[type=text],input[type=number],select{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;min-width:0}
.q{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:10px;padding:0 8px;font-size:12px;font-weight:700;margin-left:4px}
.x{border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.hh{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0}.hh input[type=text]{flex:1;min-width:110px}
.ing{display:grid;grid-template-columns:1fr 74px 104px 28px;gap:6px;margin:6px 0;align-items:center}
.row input[type=text],.row input[type=date],.row select{max-width:62%;flex:1}
a.lnk{display:block;text-decoration:none;color:var(--tx)}a.nt{display:inline-block;text-decoration:none;margin-bottom:4px}
details{border-bottom:1px solid var(--bd);padding:6px 0}summary{cursor:pointer;padding:4px 0}details .it{padding-left:10px}
.tabs button{font-size:12px;padding:9px 2px}
.dish{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px}
</style></head><body><main>
